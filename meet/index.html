<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>항만 AI 화상회의</title>
<meta name="description" content="해양복합재난 연구용역 과업참여자 전용 화상회의 — 설치·로그인·시간제한 없는 종단간 암호화 P2P 회의">
<meta name="theme-color" content="#0d1620">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0b141c;--panel:#131f2a;--panel2:#1a2835;--line:#26384a;--ink:#e6eef4;--muted:#93a6b6;--accent:#2bb3bf;--accent-w:#123b42;--danger:#e5484d;--warn:#f0a03c;--ok:#4cc38a;
  --f:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--fm:"IBM Plex Mono",ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f);-webkit-tap-highlight-color:transparent;overflow:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.num{font-family:var(--fm);font-variant-numeric:tabular-nums}
/* lobby */
#lobby{height:100%;overflow:auto;padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.lwrap{max-width:1040px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.lwrap{grid-template-columns:minmax(0,1fr)}}
.brand{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.brand .ey{font-size:11px;letter-spacing:.12em;color:var(--accent);font-weight:600}
.brand h1{margin:2px 0 0;font-size:22px;letter-spacing:-.01em}
.brand .sub{color:var(--muted);font-size:12.5px}
.pv{position:relative;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.pv video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.pv .ov{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;padding:12px;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.pv .noc{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .08s}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0}
.fld{display:grid;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.fld input,.fld select,.fld textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;color:var(--ink);width:100%;min-width:0}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#04252a;font-weight:600}
.btn.dng{background:var(--danger);border-color:var(--danger);color:#fff}
.btn:focus-visible,.tb button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink)}
.chk input{width:auto}
.inv{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.inv code{font-family:var(--fm);font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;overflow-wrap:anywhere;user-select:all;flex:1;min-width:0}
.small{font-size:12px}.muted{color:var(--muted)}
.feat{display:flex;flex-wrap:wrap;gap:6px}
.feat span{font-size:11.5px;border:1px solid var(--line);border-radius:12px;padding:2px 9px;color:var(--muted)}
.cbtn{width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.14);display:grid;place-items:center;color:#fff}
.cbtn.off{background:var(--danger)}
.cbtn svg{width:22px;height:22px}
/* room */
#room{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.top{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));border-bottom:1px solid var(--line);background:var(--panel)}
.top .tt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.pill{font-size:11.5px;border-radius:11px;padding:2px 9px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap;color:var(--muted)}
.pill.rec{background:var(--danger);border-color:var(--danger);color:#fff}
.pill.e2e{color:var(--ok)}
.main{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;min-height:0}
#stage{position:relative;padding:10px;min-height:0;overflow:hidden}
#grid{display:grid;gap:8px;height:100%;width:100%;align-content:center;justify-content:center}
.tile{position:relative;background:#05090d;border-radius:12px;overflow:hidden;border:2px solid transparent;min-width:0;min-height:0;aspect-ratio:16/9}
.tile.spk{border-color:var(--ok)}
.tile.pin{border-color:var(--accent)}
.tile video{width:100%;height:100%;object-fit:cover;background:#05090d}
.tile.screen video,.tile.fit video{object-fit:contain}
.tile.self video{transform:scaleX(-1)}
.tile.self.screen video{transform:none}
.tile .av{position:absolute;inset:0;display:grid;place-items:center}
.tile .av b{width:28%;max-width:96px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(14px,3vw,30px);color:#fff}
.tile .nm{position:absolute;left:8px;bottom:8px;display:flex;gap:6px;align-items:center;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:7px;font-size:12px;max-width:calc(100% - 16px)}
.tile .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .ic{position:absolute;right:8px;top:8px;display:flex;gap:4px}
.tile .ic i{font-style:normal;background:rgba(0,0,0,.55);border-radius:7px;padding:1px 6px;font-size:12px}
.tile .q{position:absolute;left:8px;top:8px;font-size:10.5px;background:rgba(0,0,0,.55);border-radius:6px;padding:1px 6px;font-family:var(--fm)}
.tile .tb2{position:absolute;right:8px;bottom:8px;display:none;gap:4px}
.tile:hover .tb2{display:flex}
.tile .tb2 button{border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:2px 7px;font-size:11px}
#side{width:340px;max-width:100vw;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
@media (max-width:760px){#side{position:absolute;inset:0;width:auto;z-index:20;border-left:0}}
.stabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.stabs button{flex:1;border:0;background:none;padding:10px 8px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.stabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.spane{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{font-size:13.5px;overflow-wrap:anywhere}
.msg b{font-size:12px}
.msg .t{font-size:11px;color:var(--muted);margin-left:6px}
.msg .x{white-space:pre-wrap}
.msg.sys{color:var(--muted);font-size:12px}
.sfoot{border-top:1px solid var(--line);padding:8px;display:flex;gap:6px}
.sfoot input[type=text]{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.prow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.prow .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow button{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:1px 7px;font-size:11.5px}
.avs{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;color:#fff;flex:none}
.cap{font-size:13px}.cap b{color:var(--accent);font-size:12px;margin-right:6px}
#capbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);max-width:min(92%,900px);background:rgba(0,0,0,.72);border-radius:10px;padding:6px 14px;font-size:16px;text-align:center;z-index:5;pointer-events:none}
#reacts{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:6}
.fly{position:absolute;bottom:40px;font-size:34px;animation:fly 3s ease-out forwards}
@keyframes fly{from{transform:translateY(0);opacity:1}to{transform:translateY(-60vh);opacity:0}}
@media (prefers-reduced-motion:reduce){.fly{animation:none;opacity:.9}}
#wb{position:absolute;inset:10px;z-index:4;background:#f6f7f2;border-radius:12px;overflow:hidden}
#wb canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.wbt{position:absolute;left:10px;top:10px;display:flex;gap:6px;z-index:2;flex-wrap:wrap}
.wbt button{border:1px solid #c9ccc2;background:#fff;color:#222;border-radius:7px;padding:3px 9px;font-size:12px}
.wbt button[aria-pressed=true]{outline:2px solid #2b6cb0}
.wbt .sw{width:22px;height:22px;border-radius:50%;padding:0}
/* toolbar */
.tb{display:flex;justify-content:center;gap:8px;padding:10px max(10px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));background:var(--panel);border-top:1px solid var(--line);overflow-x:auto}
.tb button{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;border:0;background:none;color:var(--ink);border-radius:10px;padding:6px 6px 4px;font-size:11px}
.tb button .ci{width:40px;height:40px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;border:1px solid var(--line)}
.tb button .ci svg{width:20px;height:20px}
.tb button.off .ci{background:var(--danger);border-color:var(--danger)}
.tb button.on .ci{background:var(--accent);border-color:var(--accent);color:#04252a}
.tb button.leave .ci{background:var(--danger);border-color:var(--danger)}
.tb .badge{position:absolute;right:6px;top:2px;background:var(--danger);color:#fff;border-radius:9px;font-size:10px;padding:0 5px}
@media (max-width:640px){.tb{justify-content:space-around;gap:2px}.tb button{min-width:52px}.tb button.opt{display:none}}
.menu{position:absolute;bottom:calc(76px + env(safe-area-inset-bottom));right:max(12px,env(safe-area-inset-right));background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);padding:6px;display:grid;z-index:30;min-width:220px}
.menu button{text-align:left;border:0;background:none;padding:9px 12px;border-radius:8px}
.menu button:hover{background:var(--panel2)}
.rmenu{display:flex;gap:4px;padding:6px}
.rmenu button{font-size:24px;padding:4px 6px}
.toast{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;z-index:60;font-size:13px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.4)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:grid;place-items:center;padding:16px}
.modal .card{max-width:520px;width:100%;max-height:90vh;overflow:auto}
table.st{width:100%;border-collapse:collapse;font-size:12px}
table.st td,table.st th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left}
</style>
</head>
<body>
<section id="lobby">
  <div class="lwrap">
    <div class="brand">
      <div><div class="ey">해양복합재난 연구용역 · 과업참여자 전용</div><h1>항만 AI 화상회의</h1>
        <div class="sub">설치·로그인·시간 제한 없음 · 종단간 암호화(P2P) · 휴대폰·노트북·PC</div></div>
      <a class="small" href="https://claude.ai/artifact/71N92W5sQjyEMxVCoCJpMT" target="_blank" rel="noopener">과업 포털 ↗</a>
    </div>
    <div class="card" style="padding:12px">
      <div class="pv"><video id="pvVid" autoplay playsinline muted></video><div class="noc" id="pvNo">카메라 꺼짐</div>
        <div class="ov"><button class="cbtn" id="pvMic" type="button" aria-label="마이크"></button><button class="cbtn" id="pvCam" type="button" aria-label="카메라"></button></div></div>
      <div class="meter" title="마이크 입력"><i id="pvLvl"></i></div>
      <div class="row">
        <label class="fld">카메라<select id="selCam"></select></label>
        <label class="fld">마이크<select id="selMic"></select></label>
        <label class="fld" id="spkBox">스피커<select id="selSpk"></select></label>
      </div>
      <div class="row">
        <label class="chk"><input type="checkbox" id="optBlur"> 배경 흐림(AI)</label>
        <label class="chk"><input type="checkbox" id="optNs" checked> 잡음·에코 제거</label>
        <label class="fld">화질<select id="optQ"><option value="auto" selected>자동(인원수 맞춤)</option><option value="hd">고화질 720p</option><option value="sd">표준 360p</option><option value="low">저대역 240p</option></select></label>
      </div>
    </div>
    <div class="card">
      <label class="fld">회의명<input id="inTitle" maxlength="60" placeholder="예: 과업 3 계측 설계 검토"></label>
      <label class="fld">내 이름(표시명)<input id="inName" maxlength="30" placeholder="예: 조재명 (㈜해연기술)"></label>
      <label class="fld">회의 코드<input id="inRoom" maxlength="64" class="num" placeholder="새 회의는 자동 생성"></label>
      <label class="fld">회의 암호<input id="inKey" maxlength="64" class="num" placeholder="새 회의는 자동 생성"></label>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" id="btnJoin" type="button" style="flex:1">회의 참여</button><button class="btn" id="btnNew" type="button">새 회의 만들기</button></div>
      <div id="invBox" hidden class="grid" style="display:grid;gap:6px">
        <div class="small muted">초대 링크(암호 포함 — 과업참여자에게만 공유)</div>
        <div class="inv"><code id="invLink"></code><button class="btn" id="btnCopy" type="button">복사</button></div>
        <div class="inv" id="hostBox" hidden><span class="small muted">진행자 링크(본인 보관용)</span><code id="hostLink"></code></div>
      </div>
      <details class="small"><summary style="cursor:pointer;color:var(--muted)">고급 설정(연결 방식·TURN 서버)</summary>
        <div class="grid" style="display:grid;gap:8px;margin-top:8px">
          <label class="fld">신호 연결망<select id="optStrat"><option value="nostr">Nostr 공용 릴레이(기본)</option><option value="mqtt">MQTT 공용 브로커</option><option value="torrent">BitTorrent 트래커</option></select></label>
          <label class="fld">TURN 서버(JSON, 선택) — 회사망·일부 LTE에서 연결이 안 될 때<textarea id="optTurn" rows="3" class="num" placeholder='[{"urls":"turn:turn.example.com:3478","username":"u","credential":"p"}]'></textarea></label>
          <div class="small muted">같은 회의의 참여자는 같은 신호 연결망을 써야 합니다(초대 링크에 포함).</div>
        </div></details>
      <div class="feat"><span>화면 공유</span><span>채팅·파일</span><span>실시간 자막</span><span>화이트보드</span><span>녹화</span><span>회의록 저장</span><span>손들기·반응</span><span>배경 흐림</span><span>진행자 제어</span><span>연결 품질</span></div>
    </div>
  </div>
</section>

<section id="room" hidden>
  <header class="top">
    <span class="tt" id="rTitle">회의</span>
    <span class="pill num" id="rTime">00:00</span>
    <span class="pill" id="rCount">1명</span>
    <span class="pill e2e" title="미디어·데이터는 참여자 간 직접(P2P) 전송되며 DTLS-SRTP로 암호화됩니다">🔒 종단간 암호화</span>
    <span class="pill rec" id="rRec" hidden>● 녹화 중</span>
    <span class="pill" id="rLock" hidden>🔐 잠김</span>
  </header>
  <div class="main">
    <div id="stage"><div id="grid"></div><div id="wb" hidden><div class="wbt" id="wbt"></div><canvas id="wbc"></canvas></div><div id="capbar" hidden></div><div id="reacts"></div></div>
    <aside id="side" hidden>
      <div class="stabs" role="tablist"><button data-p="chat" aria-selected="true">채팅</button><button data-p="ppl" aria-selected="false">참여자</button><button data-p="cap" aria-selected="false">자막·기록</button><button data-p="x" aria-selected="false" aria-label="닫기">✕</button></div>
      <div class="spane" id="pChat"></div>
      <div class="spane" id="pPpl" hidden></div>
      <div class="spane" id="pCap" hidden></div>
      <form class="sfoot" id="chatForm"><input type="file" id="fileIn" hidden><button class="btn" type="button" id="btnFile" title="파일 보내기">📎</button><input type="text" id="chatIn" placeholder="메시지" maxlength="2000" autocomplete="off"><button class="btn pri" type="submit">전송</button></form>
    </aside>
  </div>
  <nav class="tb" id="tb"></nav>
</section>
<div id="host"></div>
<script type="module" src="app.js"></script>
</body>
</html>
