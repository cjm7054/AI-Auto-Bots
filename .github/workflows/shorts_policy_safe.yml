name: Shorts Bot - Policy Safe Briefing

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'   # KST 07:00
    - cron: '0 0 * * *'    # KST 09:00
    - cron: '0 3 * * *'    # KST 12:00
    - cron: '0 6 * * *'    # KST 15:00
    - cron: '0 8 * * *'    # KST 17:00
    - cron: '0 10 * * *'   # KST 19:00
    - cron: '0 12 * * *'   # KST 21:00

jobs:
  generate-shorts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-nanum

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare optional BGM folder
        run: mkdir -p shorts_bot/assets

      - name: Run shorts bot in policy-safe mode
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_TOKEN: ${{ secrets.YOUTUBE_TOKEN }}
          SHORTS_BRAND_NAME: ${{ vars.SHORTS_BRAND_NAME || 'AI 이슈 브리핑' }}
          SHORTS_REQUIRE_HUMAN_REVIEW: ${{ vars.SHORTS_REQUIRE_HUMAN_REVIEW || 'true' }}
          SHORTS_DEFAULT_PRIVACY_STATUS: ${{ vars.SHORTS_DEFAULT_PRIVACY_STATUS || 'private' }}
          SHORTS_OUTPUT_DIR: shorts_bot/outputs
          SHORTS_DATA_DIR: shorts_bot/data
          SHORTS_BGM_PATH: shorts_bot/assets/bgm_news.mp3
          SHORTS_VOICE_NAME: ${{ vars.SHORTS_VOICE_NAME || 'ko-KR-SunHiNeural' }}
          SHORTS_VOICE_RATE: ${{ vars.SHORTS_VOICE_RATE || '+6%' }}
          RUN_SLOT: auto
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS || 'gemini-2.5-flash,gemini-2.5-flash-lite,gemini-2.5-pro' }}
        run: |
          cd shorts_bot
          python main.py
