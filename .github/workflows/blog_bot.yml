name: Daily Blog Post Generator

on:
  schedule:
    # 한국 시간 기준 오전 8시(UTC 23시), 낮 12시(UTC 3시), 오후 6시(UTC 9시)
    - cron: '0 23,3,9 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create Blogger Token File
        run: |
          echo '${{ secrets.BLOGGER_TOKEN }}' > blog_bot/blogger_token.json

      - name: Run Blog Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GEMINI_MODELS: gemini-2.5-flash,gemini-2.5-flash-lite,gemini-2.5-pro
        run: python blog_bot/main.py
