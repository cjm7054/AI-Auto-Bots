name: Blog Bot Auto Publish

on:
  schedule:
    - cron: '0 9 * * *'  # 매일 KST 18:00 (UTC 09:00)
    - cron: '0 0 * * *'  # 매일 KST 09:00 (UTC 00:00)
  push:
    branches:
      - main
    paths:
      - '.github/workflows/blog_bot_auto.yml'
      - 'blog_bot/wordpress_uploader.py'
      - 'blog_bot/main.py'
  workflow_dispatch:

concurrency:
  group: blog-bot-auto-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-blog-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Blog Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          # 카카오톡 연동 설정
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          # 자동 게시 관련 설정 (워드프레스 전용 즉시 발행, 구글 블로그 제외)
          BLOG_UPLOAD_TARGETS: "wordpress"
          BLOG_ENABLE_BLOGGER: "false"
          BLOG_ALLOW_AUTO_PUBLISH: "true"
          BLOG_PUBLISH_STATUS: "publish"
        run: python blog_bot/main.py

      - name: Save Generated Drafts to Repository
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog_bot/data/drafts/*.md 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(drafts): save generated blog post draft [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
